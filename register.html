<!DOCTYPE html>
<html>

    <head>
      <title>Contractor Pro | Register</title>
      <link rel="stylesheet" href="register.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300&family=Kanit:wght@300;500;700&family=Lato:ital,wght@0,100;0,300;1,700&display=swap" rel="stylesheet">
       
    </head>

    <body>
      <div class="mainpage">
        <div class="register-box">
          <h1>Register</h1>
          <form>
              <div class="register-group">
                  <div class="register-field">
                      <label>Enter email as username:</label>
                      <input type="email" placeholder="example@something.ca">
                  </div>

                  <div class="register-field">
                      <label>Create password:</label>
                      <input type="password" placeholder="Password">
                  </div>
                  <div class="register-field">
                      <label>Confirm password:</label>
                      <input type="password" placeholder="Password">
                  </div>

                  <button type="button" onclick="goToLogin()">Register</button>
              </div>
          </form>


        </div>
      </div>
      <script src="mel-script.js"></script>
    </body>
    
</html>
